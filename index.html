<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple filename formatter that replaces spaces with clean separators.">
  <title>Filename Formatter</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f8fafc; color:#0f172a; }
    .card { width:100%; max-width:680px; background:#fff; border:1px solid #e2e8f0; border-radius:24px; padding:30px; box-shadow:0 15px 40px rgba(15,23,42,.08); }
    .icon { width:44px; height:44px; display:grid; place-items:center; border-radius:14px; background:#2563eb; color:#fff; font-size:22px; margin-bottom:16px; }
    h1 { margin:0 0 6px; font-size:30px; }
    .subtitle { margin:0 0 28px; color:#64748b; }
    label { display:block; margin-bottom:8px; font-size:14px; font-weight:650; }
    input[type="text"], select { width:100%; padding:13px 14px; border:1px solid #cbd5e1; border-radius:12px; background:#fff; color:#0f172a; font:inherit; outline:none; }
    input[type="text"]:focus, select:focus { border-color:#2563eb; box-shadow:0 0 0 4px #dbeafe; }
    .options { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:20px 0; }
    .checkbox { min-height:48px; display:flex; align-items:center; gap:10px; margin-top:24px; padding:12px 14px; border:1px solid #cbd5e1; border-radius:12px; cursor:pointer; }
    .checkbox input { accent-color:#2563eb; }
    .result { display:flex; align-items:center; gap:10px; padding:8px 8px 8px 16px; border-radius:16px; background:#0f172a; color:#fff; }
    #output { min-width:0; flex:1; overflow-wrap:anywhere; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    button { border:0; border-radius:11px; padding:11px 16px; background:#2563eb; color:#fff; font-weight:700; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .example { margin-top:20px; padding:13px 15px; border-radius:12px; background:#eff6ff; color:#1e3a8a; font-size:14px; }
    @media (max-width:560px) { .options { grid-template-columns:1fr; } .checkbox { margin-top:0; } .card { padding:22px; } h1 { font-size:26px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">&#10022;</div>
    <h1>Filename Formatter</h1>
    <p class="subtitle">Turn spaces into clean separators instantly.</p>

    <label for="input">Text / filename</label>
    <input id="input" type="text" value="My First File" placeholder="My First File" autofocus>

    <div class="options">
      <div>
        <label for="separator">Separator</label>
        <select id="separator">
          <option value="-">Hyphen (-)</option>
          <option value="_">Underscore (_)</option>
          <option value=".">Dot (.)</option>
        </select>
      </div>
      <label class="checkbox">
        <input id="lowercase" type="checkbox">
        Convert to lowercase
      </label>
    </div>

    <label for="output">Result</label>
    <div class="result">
      <span id="output">My-First-File</span>
      <button id="copy" type="button">Copy</button>
    </div>

    <div class="example">Example: <strong>My First File</strong> becomes <strong>My-First-File</strong>.</div>
  </main>

  <script>
    const input = document.getElementById('input');
    const separator = document.getElementById('separator');
    const lowercase = document.getElementById('lowercase');
    const output = document.getElementById('output');
    const copyButton = document.getElementById('copy');

    function formatFilename() {
      let value = input.value.trim().replace(/\s+/g, separator.value);
      if (lowercase.checked) value = value.toLowerCase();
      output.textContent = value || 'Your result will appear here';
      copyButton.disabled = !value;
      return value;
    }

    input.addEventListener('input', formatFilename);
    separator.addEventListener('change', formatFilename);
    lowercase.addEventListener('change', formatFilename);

    copyButton.addEventListener('click', async () => {
      const value = formatFilename();
      if (!value) return;
      try {
        await navigator.clipboard.writeText(value);
      } catch (error) {
        const temp = document.createElement('textarea');
        temp.value = value;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        temp.remove();
      }
      copyButton.textContent = 'Copied!';
      setTimeout(() => { copyButton.textContent = 'Copy'; }, 1200);
    });

    formatFilename();
  </script>
</body>
</html>
